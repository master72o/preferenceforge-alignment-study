[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "preferenceforge-alignment-study"
version = "2.0.0"
description = "PreferenceForge: Bradley-Terry Reward Model Calibration, DPO Pipeline, Length Bias Diagnostics, and Alignment Studio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
preferenceforge = "preferenceforge.cli:main"
preference-reward = "preference_reward.cli:main"

[tool.setuptools.packages.find]
include = ["preference_reward*", "preferenceforge*"]
