# PreferenceForge DPO Training Configuration: Qwen2.5-0.5B-Instruct
model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"
dataset_path: "data/preference_dataset.jsonl"
output_dir: "checkpoints/qwen_dpo_adapter"

# Optimization Parameters
learning_rate: 3.0e-5
lr_scheduler_type: "cosine"
warmup_ratio: 0.1
weight_decay: 0.01

# DPO Hyperparameters
beta: 0.1
loss_type: "sigmoid"
max_prompt_length: 512
max_length: 1024

# Batching & Compute
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_steps: 150
fp16: true

# LoRA / PEFT Parameters
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
